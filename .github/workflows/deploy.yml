name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - CNAME
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stage an explicit allowlist instead of the repo root: this repo holds
      # research data (CSVs, PDFs, ~43 MB zip) that must not be published.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp CNAME _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
